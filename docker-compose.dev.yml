# Local development stack for Plot.
# Usage: docker compose -f docker-compose.dev.yml up -d
# Martin (tile server) arrives in a later wave — YAGNI.

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: plot
      POSTGRES_PASSWORD: plot
      POSTGRES_DB: plot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plot -d plot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
