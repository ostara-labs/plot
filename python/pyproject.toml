[project]
name = "plot-backend"
version = "0.3.0"
description = "Plot backend - geospatial search and scoring for the Plot platform."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "geoalchemy2>=0.20.0",
    "greenlet>=3.5.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Defaults (E4, E7, E9, F) + pep8-naming: casing is enforced mechanically
# (decision 27.27). Intention-revealing names are reviewed + guarded by
# tests/test_naming.py.
select = ["E4", "E7", "E9", "F", "N"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plot_backend"]
