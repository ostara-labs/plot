[project]
name = "plot-backend"
version = "0.2.0"
description = "Plot backend - geospatial search and scoring for the Plot platform."
requires-python = ">=3.12"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.3"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plot_backend"]
