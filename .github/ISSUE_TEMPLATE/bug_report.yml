name: Bug report
description: Report a bug in the template
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: How can we reproduce the issue?
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Which stack(s) does this affect?
      multiple: true
      options:
        - Rust
        - TypeScript
        - Elixir
        - Python
        - CI/CD
        - Other

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste any relevant logs or error output.
      render: bash
