name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate: invalid workflow files (bad YAML, unknown action inputs, broken
  # expressions) invalidate the merge before any stack job even runs.
  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install actionlint (checksum-verified)
        run: |
          version=1.7.12
          asset="actionlint_${version}_linux_amd64.tar.gz"
          curl -sSfL -o "$asset" "https://github.com/rhysd/actionlint/releases/download/v${version}/${asset}"
          curl -sSfL -o checksums.txt "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_checksums.txt"
          grep "$asset" checksums.txt | sha256sum --check --status -
          tar -xzf "$asset" actionlint

      - name: Lint all workflow files
        run: ./actionlint -no-color

  # Stack CI logic lives centrally in the devtools submodule's repo.
  # Bump deliberately: move the @SHA (currently devtools v1.0.0), or run
  # `make devtools-update` and keep both pins in sync.
  typescript:
    uses: ostara-labs/devtools/.github/workflows/typescript-ci.yml@d218bcdb16a8fbfe82a83051e8790e8b0efe0e36 # v1.0.0
  python:
    uses: ostara-labs/devtools/.github/workflows/python-ci.yml@4e6b4ee61ee51b86f16d5f2739ce6bb7ae89d3dc # v1.0.0

  # Secrets scanning on every PR and push (weekly full-history scan lives in
  # security.yml). Kept here so the single `gate` context covers everything.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # gitleaks-action requires a paid license on organization repos; run the
      # binary directly instead (checksum-verified download).
      - name: Install gitleaks
        shell: bash
        run: |
          curl -sSfL -o gitleaks_8.28.0_linux_x64.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          curl -sSfL -o checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_checksums.txt
          grep "gitleaks_8.28.0_linux_x64.tar.gz" checksums.txt | sha256sum --check --status -
          tar -xzf gitleaks_8.28.0_linux_x64.tar.gz gitleaks

      # Incremental range per event. Config + ignore are taken from the
      # TRUSTED base commit only: a PR cannot whitelist its own secrets via
      # .gitleaks.toml/.gitleaksignore smuggled in the head tree.
      - name: Scan for secrets
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          IGNORE=/tmp/gitleaksignore
          if ! git show "$BASE_SHA:.gitleaksignore" > "$IGNORE" 2>/dev/null; then
            printf '' > "$IGNORE"
          fi
          CONFIG=()
          if git cat-file -e "$BASE_SHA:.gitleaks.toml" 2>/dev/null; then
            git show "$BASE_SHA:.gitleaks.toml" > /tmp/gitleaks.toml
            CONFIG=(--config /tmp/gitleaks.toml)
          else
            # no trusted config: forbid head-side autodiscovery override
            rm -f .gitleaks.toml gitleaks.toml
          fi
          LOG_OPTS=()
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            LOG_OPTS=(--log-opts="$BASE_SHA..HEAD")
          fi
          ./gitleaks git "${LOG_OPTS[@]}" "${CONFIG[@]}" --verbose --redact \
            --exit-code 1 --gitleaks-ignore-path "$IGNORE" .

  # Universal merge gate: every repository built from this template exposes
  # exactly this context to the org ruleset. Composition may evolve; the
  # contract ("gate green = mergeable") does not.
  gate:
    name: gate
    needs: [workflow-lint, gitleaks, typescript, python]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify all gates passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::gate did not succeed: $result"
              exit 1
            fi
          done
          echo "all gates passed"
