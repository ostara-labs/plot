# CodeRabbit configuration - https://docs.coderabbit.ai/reference/configuration
# Free forever on public repositories. Reviews are advisory: they never
# replace human approval on trust-boundary paths (see CODEOWNERS).

language: en-US
early_access: false

reviews:
  profile: chill # assertive flags more; chill keeps signal-to-noise high
  request_changes_workflow: false # reviews must not block merges by themselves
  high_level_summary: true
  review_status: true
  poem: false
  # Naming guard (decision 27.27): lint enforces casing; these instructions
  # make the first review pass enforce the semantic half — names reveal intent.
  path_instructions:
    - path: "python/src/**"
      instructions: >-
        Flag any identifier (variable, function, class, column, enum) that
        does not reveal intent: vague names (data, tmp, res, obj, val, foo),
        invented abbreviations, or French identifiers. All technical names are
        English, spelled out, units with the _in_ pattern (price_in_euros).
        Booleans read as predicates (is_blocked).
    - path: "typescript/src/**"
      instructions: >-
        Flag any identifier that does not reveal intent: vague names
        (data, tmp, res, obj, val, foo), invented abbreviations, or French
        identifiers. All technical names are English, spelled out. UI strings
        must come from Paraglide messages, not inline literals.
  path_filters:
    # Generated by package managers - never review machine-resolved output.
    - "!**/Cargo.lock"
    - "!**/pnpm-lock.yaml"
    - "!**/mix.lock"
    - "!**/uv.lock"
    # Generated by release-please on every release.
    - "!**/CHANGELOG.md"
    # Build outputs and caches (gitignored, excluded defensively in case
    # one ever gets committed by a script gone wrong).
    - "!**/dist/**"
    - "!**/coverage/**"
    - "!**/target/"
    - "!**/_build/"
    - "!**/deps/"
    - "!**/__pycache__/"
    - "!**/.pytest_cache/"
    - "!**/.ruff_cache/"
  auto_review:
    enabled: true
    drafts: false

chat:
  auto_reply: true
